<!doctype html>
<!-- @dsCard group="UI Kit — Commons" name="Commons app — UI kit" subtitle="Interactive Shyft employee app · Today / Events / Feed / People / More + onboarding" viewport="880x720" -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Commons — Shyft employee app · UI kit</title>
<link rel="stylesheet" href="../../colors_and_type.css">
<link rel="stylesheet" href="commons.css">
<style>
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--charcoal-50);
    background-image: radial-gradient(circle at 30% 20%, rgba(50,154,240,.07), transparent 60%);
    font-family: var(--font-ui);
    min-height: 100%;
    display: flex; flex-direction: column; align-items: center;
    padding: 36px 16px 48px;
    box-sizing: border-box;
  }
  .kit-label { display: flex; align-items: center; gap: 12px; margin-bottom: 26px; }
  .kit-label img { height: 30px; width: 30px; object-fit: contain; }
  .kit-label .t { font: 600 17px/1.1 var(--font-display); color: var(--text); letter-spacing: -.01em; }
  .kit-label .s { font: 400 12.5px/1.1 var(--font-ui); color: var(--text-subtle); margin-top: 2px; }
  .stage { transform-origin: top center; }
  .hint { margin-top: 24px; font: 400 12px/1.5 var(--font-ui); color: var(--text-subtle); text-align: center; max-width: 360px; }
  #root { display: flex; justify-content: center; }
</style>
</head>
<body>
  <div class="kit-label">
    <img src="https://portal.internal.shyftsolutions.io/s2-mark.png" alt="Shyft">
    <div>
      <div class="t">Commons</div>
      <div class="s">Shyft employee app · Clarity UI kit</div>
    </div>
  </div>
  <div id="root"></div>
  <div class="hint">Tap around — open <b>More → Apps</b> to browse & install plugins, watch them appear under “Your apps” on Today and You, and open <b>More → Developer</b> to publish. Toggle Tweaks to flip developer mode &amp; widgets.</div>

  <!-- React + Babel (pinned) -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <!-- Lucide icons (line-icon set; CDN substitution — see README ICONOGRAPHY) -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

  <!-- expose hooks globally for all babel component files -->
  <script>
    window.useState = React.useState; window.useEffect = React.useEffect;
    window.useRef = React.useRef; window.useMemo = React.useMemo;
  </script>

  <!-- component modules -->
  <script type="text/babel" src="ios-frame.jsx"></script>
  <script type="text/babel" src="../../assets/Logo.jsx"></script>
  <script type="text/babel" src="Primitives.jsx"></script>
  <script type="text/babel" src="data.jsx"></script>
  <script type="text/babel" src="Cards.jsx"></script>
  <script type="text/babel" src="Chrome.jsx"></script>
  <script type="text/babel" src="TodayScreen.jsx"></script>
  <script type="text/babel" src="EventsScreen.jsx"></script>
  <script type="text/babel" src="YouScreen.jsx"></script>
  <script type="text/babel" src="StipendDetailScreen.jsx"></script>
  <script type="text/babel" src="PeopleScreen.jsx"></script>
  <script type="text/babel" src="MoreScreen.jsx"></script>
  <script type="text/babel" src="OnboardingScreen.jsx"></script>
  <script type="text/babel" src="Sheets.jsx"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="Plugins.jsx"></script>
  <script type="text/babel" src="App.jsx"></script>

  <!-- mount -->
  <script type="text/babel">
    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "developer": true,
      "showWidgets": true
    }/*EDITMODE-END*/;

    function Root() {
      const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
      return (
        <React.Fragment>
          <div className="stage">
            <IOSDevice width={390} height={844}>
              <CommonsApp tweaks={t} />
            </IOSDevice>
          </div>
          <TweaksPanel>
            <TweakSection label="Plugins" />
            <TweakToggle label="Developer mode" value={t.developer}
              onChange={(v) => setTweak('developer', v)} />
            <TweakToggle label="Show app widgets" value={t.showWidgets}
              onChange={(v) => setTweak('showWidgets', v)} />
          </TweaksPanel>
        </React.Fragment>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<Root />);
  </script>
</body>
</html>
