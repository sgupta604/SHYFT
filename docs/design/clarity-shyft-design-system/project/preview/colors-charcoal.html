<!doctype html>
<!-- @dsCard group="Colors" name="Charcoal scale" subtitle="Neutral chrome · 900 = Shyft black" viewport="700x140" --><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{font-family:var(--font-ui);background:var(--bg-elev);padding:20px 22px;color:var(--text)}
  .row{display:flex;gap:0;border-radius:var(--r-md);overflow:hidden;border:1px solid var(--border)}
  .chip{flex:1;height:56px}
  .lab{display:flex;gap:0;margin-top:8px}
  .lab span{flex:1;text-align:center;font:500 10px/1.3 var(--font-mono);color:var(--text-subtle)}
  .cap{font:500 12.5px/1.3 var(--font-ui);color:var(--text-muted);margin-top:14px}
  .cap b{color:var(--text);font-weight:600}
</style></head>
<body>
  <div class="row">
    <div class="chip" style="background:var(--charcoal-25)"></div>
    <div class="chip" style="background:var(--charcoal-50)"></div>
    <div class="chip" style="background:var(--charcoal-100)"></div>
    <div class="chip" style="background:var(--charcoal-200)"></div>
    <div class="chip" style="background:var(--charcoal-300)"></div>
    <div class="chip" style="background:var(--charcoal-400)"></div>
    <div class="chip" style="background:var(--charcoal-500)"></div>
    <div class="chip" style="background:var(--charcoal-600)"></div>
    <div class="chip" style="background:var(--charcoal-700)"></div>
    <div class="chip" style="background:var(--charcoal-800)"></div>
    <div class="chip" style="background:var(--charcoal-900);box-shadow:inset 0 0 0 2px #fff,inset 0 0 0 4px var(--charcoal-500)"></div>
  </div>
  <div class="lab"><span>25</span><span>50</span><span>100</span><span>200</span><span>300</span><span>400</span><span>500</span><span>600</span><span>700</span><span>800</span><span style="color:var(--text)">900</span></div>
  <div class="cap"><b>Charcoal</b> — neutral chrome. <b>25</b> → page backgrounds, <b>900</b> → primary text. The original Shyft black is <b>900</b> <span style="font-family:var(--font-mono)">#212529</span>.</div>
</body></html>
