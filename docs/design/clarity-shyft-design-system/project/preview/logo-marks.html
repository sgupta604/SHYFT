<!doctype html>
<!-- @dsCard group="Brand" name="Logo & marks" subtitle="S2 mark at sizes on light + lockup + mark on charcoal-900" viewport="700x175" --><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{font-family:var(--font-ui);background:var(--bg-elev);padding:18px 20px;color:var(--text);display:flex;gap:16px;align-items:stretch}
  .panel{border-radius:var(--r-xl);padding:15px 18px;display:flex;flex-direction:column;gap:13px}
  .light{flex:1.55;background:#fff;border:1px solid var(--border);justify-content:space-between}
  .dark{flex:1;background:var(--charcoal-900);align-items:center;justify-content:center;gap:14px}
  .tag{font:600 10px/1 var(--font-ui);text-transform:uppercase;letter-spacing:.08em}
  .light .tag{color:var(--text-subtle)}
  .dark .tag{color:var(--charcoal-400)}
  .sizes{display:flex;align-items:flex-end;gap:22px}
  .cell{display:flex;flex-direction:column;align-items:center;gap:7px}
  .cap{font:400 10px/1.3 var(--font-ui);color:var(--text-subtle)}
  .sep{height:1px;background:var(--border)}
  img{display:block;width:auto}
</style></head>
<body>
  <div class="panel light">
    <span class="tag">S2 mark · on light</span>
    <div class="sizes">
      <div class="cell"><img src="https://portal.internal.shyftsolutions.io/s2-mark.png" style="height:60px"><span class="cap">60 · hero</span></div>
      <div class="cell"><img src="https://portal.internal.shyftsolutions.io/s2-mark.png" style="height:40px"><span class="cap">40 · login</span></div>
      <div class="cell"><img src="https://portal.internal.shyftsolutions.io/s2-mark.png" style="height:28px"><span class="cap">28 · brand</span></div>
      <div class="cell"><img src="https://portal.internal.shyftsolutions.io/s2-mark.png" style="height:22px"><span class="cap">22 · nav</span></div>
    </div>
    <div class="sep"></div>
    <div style="display:flex;align-items:center;justify-content:space-between">
      <img src="https://portal.internal.shyftsolutions.io/shyft-solutions-lockup.png" style="height:34px">
      <span class="cap" style="text-align:right">Full lockup ·<br>login &amp; marketing only</span>
    </div>
  </div>
  <div class="panel dark">
    <span class="tag">On charcoal-900 · both tones survive</span>
    <img src="https://portal.internal.shyftsolutions.io/s2-mark.png" style="height:54px">
  </div>
</body></html>
