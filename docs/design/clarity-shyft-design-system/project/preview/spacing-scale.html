<!doctype html>
<!-- @dsCard group="Spacing" name="Spacing scale" subtitle="4pt base · 9 named steps" viewport="700x280" --><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{font-family:var(--font-ui);background:var(--bg-elev);padding:20px 24px;color:var(--text)}
  .r{display:flex;align-items:center;gap:14px;padding:4px 0}
  .nm{flex:none;width:42px;font:600 12px/1 var(--font-mono);color:var(--text)}
  .px{flex:none;width:42px;font:400 11px/1 var(--font-mono);color:var(--text-subtle)}
  .bar{height:14px;background:var(--accent);border-radius:3px}
  .use{font:400 11px/1 var(--font-ui);color:var(--text-subtle);margin-left:8px}
</style></head>
<body>
  <div class="r"><span class="nm">s-1</span><span class="px">4px</span><div class="bar" style="width:4px"></div><span class="use">inline icon padding</span></div>
  <div class="r"><span class="nm">s-2</span><span class="px">8px</span><div class="bar" style="width:8px"></div><span class="use">between inline elements</span></div>
  <div class="r"><span class="nm">s-3</span><span class="px">12px</span><div class="bar" style="width:12px"></div><span class="use">tight group</span></div>
  <div class="r"><span class="nm">s-4</span><span class="px">16px</span><div class="bar" style="width:16px"></div><span class="use">between fields · default gap</span></div>
  <div class="r"><span class="nm">s-5</span><span class="px">20px</span><div class="bar" style="width:20px"></div><span class="use">card padding</span></div>
  <div class="r"><span class="nm">s-6</span><span class="px">24px</span><div class="bar" style="width:24px"></div><span class="use">section dividers</span></div>
  <div class="r"><span class="nm">s-8</span><span class="px">32px</span><div class="bar" style="width:32px"></div><span class="use">page padding</span></div>
  <div class="r"><span class="nm">s-12</span><span class="px">48px</span><div class="bar" style="width:48px"></div><span class="use">section spacing</span></div>
  <div class="r"><span class="nm">s-16</span><span class="px">64px</span><div class="bar" style="width:64px"></div><span class="use">hero / large breathing room</span></div>
</body></html>
