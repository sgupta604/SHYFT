<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{font-family:var(--font-ui);background:var(--bg-elev);padding:20px 22px;color:var(--text)}
  .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
  .col h4{font:600 12.5px/1 var(--font-ui);margin:0 0 7px;color:var(--text)}
  .stack{display:flex;flex-direction:column;border-radius:var(--r-sm);overflow:hidden;border:1px solid var(--border)}
  .stack div{height:26px}
  .use{font:400 10.5px/1.35 var(--font-ui);color:var(--text-subtle);margin-top:6px}
</style></head>
<body>
  <div class="grid">
    <div class="col"><h4>Green</h4>
      <div class="stack"><div style="background:var(--green-300)"></div><div style="background:var(--green-500)"></div><div style="background:var(--green-700)"></div></div>
      <div class="use">Success, approved, healthy budget.</div></div>
    <div class="col"><h4>Orange</h4>
      <div class="stack"><div style="background:var(--orange-300)"></div><div style="background:var(--orange-500)"></div><div style="background:var(--orange-700)"></div></div>
      <div class="use">Warning, pending review, attention.</div></div>
    <div class="col"><h4>Pink</h4>
      <div class="stack"><div style="background:var(--pink-300)"></div><div style="background:var(--pink-500)"></div><div style="background:var(--pink-700)"></div></div>
      <div class="use">Danger, denied, destructive.</div></div>
    <div class="col"><h4>Purple</h4>
      <div class="stack"><div style="background:var(--purple-300)"></div><div style="background:var(--purple-500)"></div><div style="background:var(--purple-700)"></div></div>
      <div class="use">Category color. Internet &amp; Phone.</div></div>
    <div class="col"><h4>Yellow</h4>
      <div class="stack"><div style="background:var(--yellow-300)"></div><div style="background:var(--yellow-500)"></div><div style="background:var(--yellow-700)"></div></div>
      <div class="use">Highlight, drafts, callout.</div></div>
  </div>
</body></html>
