<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{font-family:var(--font-ui);background:var(--bg-elev);padding:22px 24px;color:var(--text);display:flex;flex-direction:column;gap:16px}
  .row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .btn{font:500 13.5px/1 var(--font-ui);border-radius:var(--r-md);border:1px solid transparent;height:36px;padding:0 16px;display:inline-flex;align-items:center;gap:7px;cursor:pointer}
  .primary{background:var(--accent);color:#fff}
  .secondary{background:var(--bg-elev);color:var(--text);border-color:var(--border-strong)}
  .ghost{background:transparent;color:var(--text-muted)}
  .danger{background:var(--danger);color:#fff}
  .sm{height:28px;padding:0 12px;font-size:12.5px}
  .xs{height:24px;padding:0 10px;font-size:11.5px;border-radius:var(--r-sm)}
  .lbl{font:500 10.5px/1 var(--font-mono);color:var(--text-subtle);width:54px;flex:none}
</style></head>
<body>
  <div class="row"><span class="lbl">36px</span>
    <button class="btn primary">New request</button>
    <button class="btn secondary">Export</button>
    <button class="btn ghost">Cancel</button>
    <button class="btn danger">Deny</button>
  </div>
  <div class="row"><span class="lbl">28px</span>
    <button class="btn primary sm">Small primary</button>
    <button class="btn secondary sm">Small secondary</button>
    <button class="btn ghost sm">Ghost</button>
  </div>
  <div class="row"><span class="lbl">24px</span>
    <button class="btn primary xs">XS</button>
    <button class="btn secondary xs">XS</button>
    <span style="font:400 11.5px/1 var(--font-ui);color:var(--text-subtle)">One primary per surface · heights 36 / 28 / 24</span>
  </div>
</body></html>
