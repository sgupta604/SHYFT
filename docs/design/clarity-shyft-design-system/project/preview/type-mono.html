<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{font-family:var(--font-ui);background:var(--bg-elev);padding:20px 24px;color:var(--text)}
  .meta{font:500 11px/1.3 var(--font-mono);color:var(--text-subtle);margin-bottom:8px}
  .meta b{color:var(--text-muted);font-weight:600;font-family:var(--font-ui);font-size:11.5px}
  .big{font:500 22px/1.5 var(--font-mono);font-feature-settings:"tnum" 1;color:var(--text)}
  .tbl{margin-top:14px;border:1px solid var(--border);border-radius:var(--r-md);overflow:hidden}
  .tr{display:flex;justify-content:space-between;padding:7px 14px;font:500 13px/1.3 var(--font-mono);font-feature-settings:"tnum" 1;border-bottom:1px solid var(--border)}
  .tr:last-child{border-bottom:0}
  .tr:nth-child(odd){background:var(--bg-subtle)}
  .tr .k{color:var(--text-muted);font-family:var(--font-ui);font-weight:500}
</style></head>
<body>
  <div class="meta"><b>Mono 13</b> &nbsp;JetBrains Mono · 500 · tabular numerics</div>
  <div class="big">$4,180.00 · REQ-5031 · 2026-05-08T10:14</div>
  <div class="tbl">
    <div class="tr"><span class="k">Reimbursed YTD</span><span>$28,510.00</span></div>
    <div class="tr"><span class="k">Pending</span><span>$1,118.00</span></div>
    <div class="tr"><span class="k">Days until reset</span><span>324</span></div>
  </div>
</body></html>
