<!doctype html>
<!-- @dsCard group="Colors" name="Blue scale" subtitle="Primary brand ramp · 500 = #329af0" viewport="700x150" --><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{font-family:var(--font-ui);background:var(--bg-elev);padding:20px 22px;color:var(--text)}
  .row{display:flex;gap:0;border-radius:var(--r-md);overflow:hidden;border:1px solid var(--border)}
  .chip{flex:1;height:56px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:5px}
  .lab{display:flex;gap:0;margin-top:8px}
  .lab span{flex:1;text-align:center;font:500 10px/1.3 var(--font-mono);color:var(--text-subtle)}
  .hx{display:flex;gap:0;margin-top:2px}
  .hx span{flex:1;text-align:center;font:400 9px/1.3 var(--font-mono);color:var(--text-subtle)}
  .cap{font:500 12.5px/1.3 var(--font-ui);color:var(--text-muted);margin-top:14px}
  .cap b{color:var(--text);font-weight:600}
  .star{position:absolute;font-size:11px;margin-top:-2px}
</style></head>
<body>
  <div class="row">
    <div class="chip" style="background:var(--blue-25)"></div>
    <div class="chip" style="background:var(--blue-50)"></div>
    <div class="chip" style="background:var(--blue-100)"></div>
    <div class="chip" style="background:var(--blue-200)"></div>
    <div class="chip" style="background:var(--blue-300)"></div>
    <div class="chip" style="background:var(--blue-400)"></div>
    <div class="chip" style="background:var(--blue-500);box-shadow:inset 0 0 0 2px #fff,inset 0 0 0 4px var(--blue-700)"></div>
    <div class="chip" style="background:var(--blue-600)"></div>
    <div class="chip" style="background:var(--blue-700)"></div>
    <div class="chip" style="background:var(--blue-800)"></div>
    <div class="chip" style="background:var(--blue-900)"></div>
  </div>
  <div class="lab"><span>25</span><span>50</span><span>100</span><span>200</span><span>300</span><span>400</span><span style="color:var(--text)">500</span><span>600</span><span>700</span><span>800</span><span>900</span></div>
  <div class="hx"><span></span><span></span><span></span><span></span><span></span><span></span><span>329af0</span><span>228be6</span><span></span><span></span><span></span></div>
  <div class="cap"><b>Blue</b> — primary brand. <b>500</b> = anchor <span style="font-family:var(--font-mono)">#329af0</span> for buttons &amp; active states; 600 hover; 700+ for text on tints.</div>
</body></html>
