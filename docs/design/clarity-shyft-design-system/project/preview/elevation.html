<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{font-family:var(--font-ui);background:var(--bg);padding:30px 24px;color:var(--text)}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px}
  .cell{text-align:center}
  .box{height:62px;background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--r-xl)}
  .nm{font:600 12px/1.2 var(--font-mono);color:var(--text);margin-top:14px}
  .use{font:400 10px/1.25 var(--font-ui);color:var(--text-subtle);margin-top:3px}
</style></head>
<body>
  <div class="grid">
    <div class="cell"><div class="box" style="box-shadow:var(--shadow-1)"></div><div class="nm">shadow-1</div><div class="use">resting cards, tiles</div></div>
    <div class="cell"><div class="box" style="box-shadow:var(--shadow-2)"></div><div class="nm">shadow-2</div><div class="use">hover lift, dropdowns</div></div>
    <div class="cell"><div class="box" style="box-shadow:var(--shadow-3)"></div><div class="nm">shadow-3</div><div class="use">app switcher, palette</div></div>
    <div class="cell"><div class="box" style="box-shadow:var(--shadow-pop)"></div><div class="nm">shadow-pop</div><div class="use">modals, drag</div></div>
  </div>
</body></html>
