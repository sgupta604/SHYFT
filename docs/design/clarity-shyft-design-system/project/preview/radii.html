<!doctype html>
<!-- @dsCard group="Spacing" name="Corner radii" subtitle="8 / 10 / 14 / 20 + 2xl + full" viewport="700x150" --><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{font-family:var(--font-ui);background:var(--bg-elev);padding:20px 22px;color:var(--text)}
  .grid{display:grid;grid-template-columns:repeat(6,1fr);gap:14px}
  .cell{text-align:center}
  .box{height:60px;background:var(--accent-soft);border:1.5px solid var(--accent);border-bottom:none}
  .nm{font:600 12px/1.2 var(--font-mono);color:var(--text);margin-top:8px}
  .use{font:400 10px/1.25 var(--font-ui);color:var(--text-subtle);margin-top:3px}
</style></head>
<body>
  <div class="grid">
    <div class="cell"><div class="box" style="border-radius:var(--r-sm) var(--r-sm) 0 0"></div><div class="nm">r-sm · 8</div><div class="use">tags, kbd</div></div>
    <div class="cell"><div class="box" style="border-radius:var(--r-md) var(--r-md) 0 0"></div><div class="nm">r-md · 10</div><div class="use">buttons, inputs</div></div>
    <div class="cell"><div class="box" style="border-radius:var(--r-lg) var(--r-lg) 0 0"></div><div class="nm">r-lg · 14</div><div class="use">icon tiles</div></div>
    <div class="cell"><div class="box" style="border-radius:var(--r-xl) var(--r-xl) 0 0"></div><div class="nm">r-xl · 20</div><div class="use">cards, tables</div></div>
    <div class="cell"><div class="box" style="border-radius:var(--r-2xl) var(--r-2xl) 0 0"></div><div class="nm">r-2xl · 28</div><div class="use">modals</div></div>
    <div class="cell"><div class="box" style="border-radius:var(--r-full) var(--r-full) 0 0"></div><div class="nm">r-full</div><div class="use">pills, avatars</div></div>
  </div>
</body></html>
