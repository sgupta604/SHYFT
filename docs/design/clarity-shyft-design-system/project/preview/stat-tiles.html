<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{font-family:var(--font-ui);background:var(--bg);padding:24px;color:var(--text)}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  .tile{background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--r-xl);padding:18px 18px;box-shadow:var(--shadow-1)}
  .k{font:500 12.5px/1 var(--font-ui);color:var(--text-muted)}
  .v{font:600 38px/1.05 var(--font-display);letter-spacing:-.02em;color:var(--text);margin:10px 0 6px}
  .sub{font:400 12px/1.3 var(--font-ui);color:var(--text-subtle)}
  .sub b{font-family:var(--font-mono);font-weight:500;color:var(--text-muted)}
  .delta{display:inline-flex;align-items:center;gap:4px;font:600 11.5px/1 var(--font-mono);color:var(--green-700);background:var(--green-300);padding:3px 7px;border-radius:var(--r-full)}
</style></head>
<body>
  <div class="grid">
    <div class="tile"><div class="k">Pending review</div><div class="v">9</div><div class="sub">Avg approval <b>~1.4 days</b></div></div>
    <div class="tile"><div class="k">Reimbursed YTD</div><div class="v">$28,510</div><div class="sub"><span class="delta">▲ 19%</span> vs. last year</div></div>
    <div class="tile"><div class="k">Days until reset</div><div class="v">324</div><div class="sub"><b>Apr 1, 2027</b></div></div>
  </div>
</body></html>
