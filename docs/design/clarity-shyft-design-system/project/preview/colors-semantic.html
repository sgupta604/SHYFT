<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{font-family:var(--font-ui);background:var(--bg-elev);padding:18px 22px;color:var(--text)}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:9px 26px}
  .tok{display:flex;align-items:center;gap:10px}
  .sw{width:24px;height:24px;border-radius:6px;border:1px solid var(--border);flex:none}
  .nm{font:500 12px/1.2 var(--font-mono);color:var(--text)}
  .ds{font:400 11px/1.2 var(--font-ui);color:var(--text-subtle);margin-left:auto}
</style></head>
<body>
  <div class="grid">
    <div class="tok"><div class="sw" style="background:var(--bg)"></div><span class="nm">--bg</span><span class="ds">page</span></div>
    <div class="tok"><div class="sw" style="background:var(--text)"></div><span class="nm">--text</span><span class="ds">primary</span></div>
    <div class="tok"><div class="sw" style="background:var(--bg-elev)"></div><span class="nm">--bg-elev</span><span class="ds">cards</span></div>
    <div class="tok"><div class="sw" style="background:var(--text-muted)"></div><span class="nm">--text-muted</span><span class="ds">secondary</span></div>
    <div class="tok"><div class="sw" style="background:var(--bg-subtle)"></div><span class="nm">--bg-subtle</span><span class="ds">hover</span></div>
    <div class="tok"><div class="sw" style="background:var(--text-subtle)"></div><span class="nm">--text-subtle</span><span class="ds">captions</span></div>
    <div class="tok"><div class="sw" style="background:var(--border)"></div><span class="nm">--border</span><span class="ds">hairline</span></div>
    <div class="tok"><div class="sw" style="background:var(--accent)"></div><span class="nm">--accent</span><span class="ds">action</span></div>
    <div class="tok"><div class="sw" style="background:var(--border-strong)"></div><span class="nm">--border-strong</span><span class="ds">inputs</span></div>
    <div class="tok"><div class="sw" style="background:var(--accent-soft)"></div><span class="nm">--accent-soft</span><span class="ds">active nav</span></div>
    <div class="tok"><div class="sw" style="background:var(--success)"></div><span class="nm">--success</span><span class="ds">approved</span></div>
    <div class="tok"><div class="sw" style="background:var(--warn)"></div><span class="nm">--warn</span><span class="ds">pending</span></div>
    <div class="tok"><div class="sw" style="background:var(--danger)"></div><span class="nm">--danger</span><span class="ds">denied</span></div>
    <div class="tok"><div class="sw" style="background:var(--bg-sunken)"></div><span class="nm">--bg-sunken</span><span class="ds">wells</span></div>
  </div>
</body></html>
